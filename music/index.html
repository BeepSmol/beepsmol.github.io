<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeepSmol | Music</title> 
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1a1a2e;
            --panel-bg: #2d3436;
            --panel-dark: #2d3436;
            --text-main: #f1f5f9;
            --purple-accent: #a29bfe;
            --yellow-accent: #facc15;
            --indie-border: 1px solid #000;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            border: ridge rgb(175, 148, 29) 20px;
            background-image: url('placeholder.png');
            background-repeat: repeat;
            background-size: 100px 100px;
        }

        /* --- Sticky Navigation Bar --- */
        .nav-wrapper {
            background: var(--bg-dark);
            border-bottom: 2px solid #000;
            padding: 15px 10px;
            position: sticky;
            top: 0;
            z-index: 2000;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .nav-title {
            font-family: sans-serif;
            font-size: 2.8rem;
            color: var(--yellow-accent);
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 10px;
            display: block;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-links a {
            background: var(--purple-accent);
            color: #1a1a2e;
            border: 2px solid #000;
            padding: 6px 16px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 3px 3px 0px #000;
            transition: all 0.1s;
            text-transform: uppercase;
        }

        .nav-links a:hover {
            background: var(--yellow-accent);
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #000;
        }

        .nav-links a:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #000;
        }

        .nav-social-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            font-size: 0.85rem;
            font-weight: 900;
            text-transform: uppercase;
            border: 2px solid #000;
            box-shadow: 2px 2px 0px #000;
            transition: all 0.1s;
            text-decoration: none;
        }

        .nav-social-btn.spotify {
            background-color: #1DB954;
            color: #000;
        }

        .nav-social-btn.spotify:hover {
            background-color: #1ed760;
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px #000;
        }

        .nav-social-btn.youtube {
            background-color: #FF0000;
            color: #fff;
        }

        .nav-social-btn.youtube:hover {
            background-color: #e60000;
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px #000;
        }

        .nav-social-btn.discord {
            background-color: #5865F2;
            color: #fff;
        }

        .nav-social-btn.discord:hover {
            background-color: #4752c4;
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px #000;
        }

        /* --- Visualizer Containers --- */
        #left-vis-container,
        #right-vis-container {
            position: fixed;
            top: 175px;
            height: calc(100vh - 175px);
            width: 260px;
            max-width: calc((100vw - 1040px) / 2);
            box-sizing: border-box;
            z-index: 5;
            pointer-events: none;
        }

        @media (min-width: 1600px) {
            #left-vis-container,
            #right-vis-container {
                width: 280px;
            }
        }

        /* Responsive: hide visualizers when there is no room beside the 1000px content box */
        @media (max-width: 1100px) {
            #left-vis-container,
            #right-vis-container {
                display: none !important;
            }
        }

        /* --- Main Layout --- */
        .site-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .content-box {
            background: var(--panel-bg);
            border: ridge rgb(0, 0, 0) 6px;
            margin-bottom: 30px;
            position: relative;
            box-shadow: 0 0 10px 12.5px rgba(0,0,0,0.3);
            background-image: linear-gradient(to bottom, #494636, #2d3436);
        }

        .box-title {
            background: var(--purple-accent);
            color: #1a1a2e;
            padding: 2px 15px;
            font-family: sans-serif;
            font-size: 1.5rem;
            display: inline-block;
            margin-top: -18px;
            margin-left: 15px;
            border: 2px solid #000;
            font-weight: bold;
        }

        .box-body { padding: 25px; }

        /* Song Cards & Vinyl Disc Animation */
        .song-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .song-card {
            background: #1a1a2e;
            border: 3px solid #000;
            padding: 15px;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            overflow: visible;
        }

        .song-card.playing {
            border-color: var(--yellow-accent);
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.4);
            z-index: 20;
        }

        .song-cover-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
            overflow: visible;
        }

        .vinyl-disc-container {
            position: absolute;
            top: 4%;
            left: 4%;
            width: 92%;
            height: 92%;
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            transform: translateX(0);
            opacity: 0;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }

        .song-card.playing .vinyl-disc-container {
            transform: translateX(38%);
            opacity: 1;
        }

        .vinyl-disc {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(3px 4px 10px rgba(0, 0, 0, 0.85));
            animation: spin-vinyl 2.8s linear infinite;
            animation-play-state: paused;
        }

        .song-card.playing .vinyl-disc {
            animation-play-state: running;
        }

        /* Fullscreen Player Vinyl */
        .fs-cover-wrapper {
            position: relative;
            width: 100%;
            max-width: 24rem;
            aspect-ratio: 1 / 1;
            margin-bottom: 1.5rem;
            overflow: visible;
        }

        .fs-vinyl-container {
            position: absolute;
            top: 4%;
            left: 4%;
            width: 92%;
            height: 92%;
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            transform: translateX(0);
            opacity: 0;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }

        .fs-vinyl-container.playing {
            transform: translateX(38%);
            opacity: 1;
        }

        .fs-vinyl-disc {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(4px 4px 14px rgba(0, 0, 0, 0.9));
            animation: spin-vinyl 3s linear infinite;
            animation-play-state: paused;
        }

        .fs-vinyl-container.playing .fs-vinyl-disc {
            animation-play-state: running;
        }

        @media (max-width: 640px) {
            .song-card.playing .vinyl-disc-container {
                transform: translateX(28%);
            }
            .fs-vinyl-container.playing {
                transform: translateX(28%);
            }
        }

        @keyframes spin-vinyl {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        }

        .song-thumb-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #000;
            border: 2px solid #000;
            margin-bottom: 0;
            overflow: hidden;
            position: relative;
            z-index: 2;
        }

        .song-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .song-card:hover .song-thumb { transform: scale(1.05); }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #000;
            border: 2px solid #000;
            margin: 10px 0;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--yellow-accent);
            transition: width 0.1s linear;
        }

        .song-card.playing .progress-fill { background: var(--purple-accent); }

        .btn-group {
            margin-top: auto;
            display: flex;
            gap: 10px;
        }

        .btn-play {
            flex: 2;
            background: var(--yellow-accent);
            color: #000;
            font-weight: bold;
            text-align: center;
            padding: 8px;
            border: 2px solid #000;
            box-shadow: 2px 2px 0px #000;
            text-transform: uppercase;
            font-family: sans-serif;
            font-size: 1.1rem;
            transition: all 0.1s;
            cursor: pointer;
        }

        .btn-fullscreen {
            flex: 1;
            background: var(--panel-bg);
            color: white;
            font-weight: bold;
            text-align: center;
            padding: 8px;
            border: 2px solid #000;
            box-shadow: 2px 2px 0px #000;
            font-size: 1.1rem;
            transition: all 0.1s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-play:hover, .btn-fullscreen:hover {
            background: white;
            color: #000;
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px #000;
        }

        .song-card.playing .btn-play {
            background: var(--purple-accent);
            color: white;
        }

        .btn-fullscreen.playing {
            background: var(--purple-accent);
            color: white;
            box-shadow: 0 0 8px var(--purple-accent);
            border-color: var(--purple-accent);
        }

        footer {
            margin: 50px 0;
            text-align: center;
            font-family: sans-serif;
            color: var(--yellow-accent);
            background: #000;
            padding: 10px 20px;
            border: 2px solid var(--purple-accent);
            display: block;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        h3 { color: white; font-weight: bold; font-size: 1.25rem; margin-bottom: 4px; }
    </style>
        
</head>
<body>

    <script>
        // --- Song Data ---
        const songs = [
            {
                id: "small-again",
                title: "Small, Again",
                audio: "smallagain.mp3",
                cover: "smallagain.png",
                duration: "2:54",
                snippetUrl: "#"
            },
            {
                id: "meadowofthesea",
                title: "Grass?",
                audio: "meadowofthesea.mp3",
                cover: "placeholder.png",
                duration: "2:32",
                snippetUrl: "#"
            },
            {
                id: "shopkept",
                title: "Shopkept (WIP)",
                audio: "shopkept.mp3",
                cover: "placeholder.png",
                duration: "1:03",
                snippetUrl: "#"
            },
            {
                id: "neon",
                title: "NEON (WIP)",
                audio: "neon.mp3",
                cover: "placeholder.png",
                duration: "2:48",
                snippetUrl: "#"
            },
            {
                id: "insomnomania",
                title: "Insomnomania (WIP)",
                audio: "insomnomania.mp3",
                cover: "placeholder.png",
                duration: "0:50",
                snippetUrl: "#"
            },
            {
                id: "metalknife",
                title: "Metal Knife",
                audio: "metalknife.mp3",
                cover: "metalknife.png",
                duration: "1:58",
                snippetUrl: "#"
            },
            {
                id: "neighbourinferno",
                title: "Neighbour Inferno",
                audio: "neighbourinferno.mp3",
                cover: "neighbourinferno.png",
                duration: "2:13",
                snippetUrl: "#"
            },
            {
                id: "summanova",
                title: "Summa Nova",
                audio: "summanova.mp3",
                cover: "Negative.png",  
                duration: "2:15",
                snippetUrl: "#"
            },
            {
                id: "seaofsynth",
                title: "Sea of Synth",
                audio: "seaofsynth.mp3",
                cover: "Negative.png",  
                duration: "2:36",
                snippetUrl: "#"
            },
            {
                id: "fidelity",
                title: "Fidelity",
                audio: "fidelity.mp3",
                cover: "Negative.png",  
                duration: "1:36",
                snippetUrl: "#"
            },
            {
                id: "takeabreak",
                title: "Take a Break",
                audio: "takeabreak.mp3",
                cover: "Negative.png",  
                duration: "1:46",
                snippetUrl: "#"
            }
        ];

        const currentAudio = new Audio();

        let currentSongIndex = -1; // The index from the main `songs` array
        let currentPlaylistIndex = -1; // The index from the `playlist` array
        let fullscreenIndex = -1; // Index of song currently in fullscreen view
        let isAudioContextInitialized = false;
        let isPlaylistActive = false;

        let audioContext, analyser, sourceNode;
        let frequencyData, timeDomainData;
        let leftVisCanvas, leftVisCtx, rightVisCanvas, rightVisCtx;

        let playlist = [];
        let playlistOptions = {
            isShuffle: false,
            isLoopSong: false,
            isLoopPlaylist: false,
        };

        // --- Main UI Rendering ---
        function renderSongs() {
            const grid = document.getElementById('song-grid');
            grid.innerHTML = songs.map((song, index) => `
                <div class="song-card" id="card-${index}">
                    <div class="song-cover-wrapper">
                        <div class="vinyl-disc-container">
                            <img src="vynil.png" alt="Vinyl Disc" class="vinyl-disc">
                        </div>
                        <div class="song-thumb-container">
                            <img src="${song.cover}" 
                                 onerror="this.src='placeholder.png'" 
                                 alt="${song.title}" class="song-thumb">
                        </div>
                    </div>
                    <h3>${song.title}</h3>
                    <p class="text-slate-400 text-xs font-bold font-mono tracking-widest">${song.duration}</p>
                    
                    <div class="progress-bar-bg cursor-pointer" data-song-index="${index}">
                        <div id="progress-${index}" class="progress-fill"></div>
                    </div>

                    <div class="btn-group">
                        <button id="btn-${index}" class="btn-play" onclick="playSong(${index}, false)">
                            <i class="fas fa-play ml-1"></i> Play
                        </button>
                        <button class="btn-fullscreen" onclick="openFullscreen(${index})" title="Fullscreen Mode">
                            <i class="fas fa-expand"></i>
                        </button>
                        <button class="btn-fullscreen" onclick="addToPlaylist(${index})" title="Add to Playlist">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            // Add seek functionality after rendering
            document.querySelectorAll('.progress-bar-bg').forEach(progressBar => {
                progressBar.addEventListener('mousedown', handleSeek);
            });
        }

        function handleSeek(e) {
            const progressBar = e.currentTarget;
            const songIndex = parseInt(progressBar.dataset.songIndex, 10);

            // Only allow seeking on the currently playing song.
            if (currentSongIndex !== songIndex || !currentAudio || !currentAudio.duration) return;

            const seek = (event) => {
                const rect = progressBar.getBoundingClientRect();
                const clickX = event.clientX - rect.left;
                const width = progressBar.clientWidth;
                const percentage = Math.max(0, Math.min(1, clickX / width));
                currentAudio.currentTime = percentage * currentAudio.duration;
            };

            // Initial seek on click
            seek(e);

            const onMouseMove = (moveEvent) => {
                seek(moveEvent);
            };

            const onMouseUp = () => {
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            };

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        }

        function initAudioContext() {
            if (isAudioContextInitialized) {
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                return;
            }
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContext();
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                analyser.smoothingTimeConstant = 0.8;
                frequencyData = new Uint8Array(analyser.frequencyBinCount);
                timeDomainData = new Uint8Array(analyser.frequencyBinCount);
                sourceNode = audioContext.createMediaElementSource(currentAudio);
                sourceNode.connect(analyser);
                analyser.connect(audioContext.destination);
                isAudioContextInitialized = true;
            } catch (e) {
                console.error("Web Audio API is not supported or failed to initialize.", e);
            }
        }

        // --- Core Playback Logic ---
        function playSong(songIndex, fromPlaylist = false, playlistIdx = -1) {
            const song = songs[songIndex];
            if (song.audio === '#') {
                alert("This track is not available yet!");
                return;
            }

            // Check if we are clicking the same song in the SAME context (Playlist vs Main List)
            // This fixes the bug where clicking "Play" on the playlist wouldn't takeover if the song was already playing from the main list
            const isSameContext = (isPlaylistActive === fromPlaylist) && 
                                  (!isPlaylistActive || currentPlaylistIndex === playlistIdx);

            if (currentSongIndex === songIndex && currentAudio.src && isSameContext) {
                if (currentAudio.paused) {
                    currentAudio.play();
                } else {
                    currentAudio.pause();
                }
                return;
            }

            // Stop previous audio and reset state
            currentAudio.pause();

            const oldSongIndex = currentSongIndex;
            
            // Set new state
            currentAudio.src = song.audio;

            // Initialize audio context on first play, and resume if suspended
            initAudioContext();
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }

            currentSongIndex = songIndex;
            isPlaylistActive = fromPlaylist;
            currentPlaylistIndex = playlistIdx;

            // Setup listeners
            currentAudio.ontimeupdate = () => {
                const pb = document.getElementById(`progress-${currentSongIndex}`);
                if (pb && currentAudio && currentAudio.duration) {
                    const pct = (currentAudio.currentTime / currentAudio.duration) * 100 + '%';
                    pb.style.width = pct;
                    if(fullscreenIndex === currentSongIndex) {
                        const fspb = document.getElementById('fs-progress-fill');
                        if(fspb) fspb.style.width = pct;
                    }
                }
            };

            currentAudio.onended = () => {
                if (isPlaylistActive) {
                    playNextInPlaylist();
                } else {
                    const pb = document.getElementById(`progress-${currentSongIndex}`);
                    if (pb) pb.style.width = '0%';
                    if(fullscreenIndex === currentSongIndex) {
                        const fspb = document.getElementById('fs-progress-fill');
                        if(fspb) fspb.style.width = '0%';
                    }
                    currentAudio.src = ''; 
                    currentSongIndex = -1;
                    updateAllUI();
                }
            };

            currentAudio.onplay = () => updateAllUI();
            currentAudio.onpause = () => updateAllUI();

            currentAudio.play().catch(e => console.error("Playback failed:", e));
            if (oldSongIndex !== -1) {
                const oldPb = document.getElementById(`progress-${oldSongIndex}`);
                if (oldPb) oldPb.style.width = '0%';
            }
            updateAllUI();
        }

        function playNextInPlaylist() {
            if (!isPlaylistActive || playlist.length === 0) {
                if(currentAudio) {
                    currentAudio.pause();
                    currentAudio.src = '';
                }
                isPlaylistActive = false;
                currentSongIndex = -1;
                currentPlaylistIndex = -1;
                updateAllUI();
                return;
            }

            if (playlistOptions.isLoopSong) {
                playSong(currentSongIndex, true, currentPlaylistIndex);
                return;
            }

            let nextPlaylistIndex = currentPlaylistIndex;
            if (playlistOptions.isShuffle) {
                nextPlaylistIndex = Math.floor(Math.random() * playlist.length);
                if (playlist.length > 1 && nextPlaylistIndex === currentPlaylistIndex) {
                    nextPlaylistIndex = (nextPlaylistIndex + 1) % playlist.length;
                }
            } else {
                nextPlaylistIndex++;
            }

            if (nextPlaylistIndex >= playlist.length) {
                if (playlistOptions.isLoopPlaylist) {
                    playSong(playlist[0], true, 0);
                } else {
                    isPlaylistActive = false;
                    currentAudio.pause(); // Pause it
                    currentAudio.src = ''; // Clear the source
                    currentSongIndex = -1;
                    currentPlaylistIndex = -1;
                    updateAllUI();
                }
            } else {
                playSong(playlist[nextPlaylistIndex], true, nextPlaylistIndex);
            }
        }

        // --- Playlist Management ---
        function addToPlaylist(songIndex) {
            if (!playlist.includes(songIndex)) {
                playlist.push(songIndex);
                renderPlaylist();
                savePlaylistState();
                flashNotification(`Added "${songs[songIndex].title}" to playlist.`);
            } else {
                flashNotification(`"${songs[songIndex].title}" is already in the playlist.`);
            }
        }

        function removeFromPlaylist(pIndex) {
            const removedSong = songs[playlist[pIndex]];
            playlist.splice(pIndex, 1);

            if (isPlaylistActive && currentPlaylistIndex === pIndex) {
                // If we removed the current song, adjust index so we don't skip the next one
                if(!playlistOptions.isShuffle) currentPlaylistIndex--;
                playNextInPlaylist(); // Play the next song if the current one is removed
            } else if (isPlaylistActive && pIndex < currentPlaylistIndex) {
                currentPlaylistIndex--; // Adjust index if an earlier song is removed
            }

            renderPlaylist();
            savePlaylistState();
            flashNotification(`Removed "${removedSong.title}".`);
        }

        function clearPlaylist() {
            if (confirm("Are you sure you want to clear the entire playlist?")) {
                playlist = [];
                if (isPlaylistActive) {
                    currentAudio.pause(); // Pause it
                    currentAudio.src = ''; // Clear the source
                    isPlaylistActive = false;
                    currentSongIndex = -1;
                    currentPlaylistIndex = -1;
                }
                renderPlaylist();
                savePlaylistState();
                updateAllUI();
                flashNotification("Playlist cleared.");
            }
        }

        function skipToNextTrack() {
            if (!isPlaylistActive) {
                flashNotification("Can only skip when playing from a playlist.");
                return;
            }
            playNextInPlaylist();
        }

        // --- Playlist Controls ---
        function playCurrentPlaylistTrack() {
            if (isPlaylistActive && currentAudio.src) {
                if (currentAudio.paused) currentAudio.play();
                else currentAudio.pause();
            } else if (playlist.length > 0) {
                playSong(playlist[0], true, 0);
            } else {
                flashNotification("Playlist is empty!");
            }
        }

        function toggleShuffle() {
            playlistOptions.isShuffle = !playlistOptions.isShuffle;
            flashNotification(playlistOptions.isShuffle ? "Shuffle On" : "Shuffle Off");
            updatePlaylistControlsUI();
            savePlaylistState();
        }

        function toggleLoopSong() {
            playlistOptions.isLoopSong = !playlistOptions.isLoopSong;
            if (playlistOptions.isLoopSong) playlistOptions.isLoopPlaylist = false;
            flashNotification(playlistOptions.isLoopSong ? "Loop Song On" : "Loop Song Off");
            updatePlaylistControlsUI();
            savePlaylistState();
        }

        function toggleLoopPlaylist() {
            playlistOptions.isLoopPlaylist = !playlistOptions.isLoopPlaylist;
            if (playlistOptions.isLoopPlaylist) playlistOptions.isLoopSong = false;
            flashNotification(playlistOptions.isLoopPlaylist ? "Loop Playlist On" : "Loop Playlist Off");
            updatePlaylistControlsUI();
            savePlaylistState();
        }

        // --- Fullscreen Logic ---
        function openFullscreen(index, fromUrl = false) {
            const song = songs[index];
            fullscreenIndex = index;
            
            document.getElementById('fs-cover').src = song.cover;
            document.getElementById('fs-title').innerText = song.title;
            document.getElementById('fullscreen-player').style.display = 'flex';
            
            // Set URL search param, but only if not triggered by URL load itself
            if(song.id && !fromUrl) {
                const url = new URL(window.location);
                url.searchParams.set('song', song.id);
                history.pushState({ songId: song.id }, '', url);
            }
            
            updateAllUI(); // Sync play button state
        }

        function closeFullscreen() {
            // If we are in a state pushed by openFullscreen, going back will trigger onpopstate
            // which will then close the modal via checkUrlForSong.
            if (history.state && history.state.songId) {
                history.back();
            } else {
                // If we loaded directly to the song URL, there's no previous state to go back to.
                // So, we manually close the modal and clean up the URL.
                document.getElementById('fullscreen-player').style.display = 'none';
                fullscreenIndex = -1;
                const url = new URL(window.location);
                url.searchParams.delete('song');
                history.replaceState({}, '', url); // Use replaceState to not create a new history entry
            }
        }

        function togglePlayFullscreen() {
            if(fullscreenIndex === -1) return;
            playSong(fullscreenIndex, false); // Play as single song (not playlist) by default
        }

        // Add seek for fullscreen bar
        document.getElementById('fs-progress-container').addEventListener('mousedown', (e) => {
            if (currentSongIndex !== fullscreenIndex || !currentAudio || !currentAudio.duration) return;
            
            const progressBar = e.currentTarget;
            const seek = (event) => {
                const rect = progressBar.getBoundingClientRect();
                const clickX = event.clientX - rect.left;
                const width = progressBar.clientWidth;
                const percentage = Math.max(0, Math.min(1, clickX / width));
                currentAudio.currentTime = percentage * currentAudio.duration;
            };
            seek(e);
            
            const onMouseMove = (moveEvent) => seek(moveEvent);
            const onMouseUp = () => {
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            };
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });

        function checkUrlForSong() {
            const urlParams = new URLSearchParams(window.location.search);
            const songId = urlParams.get('song');

            if (songId) {
                const index = songs.findIndex(s => s.id === songId);
                if (index !== -1 && (document.getElementById('fullscreen-player').style.display === 'none' || !document.getElementById('fullscreen-player').style.display)) {
                    openFullscreen(index, true);
                }
            } else {
                // If no song in URL, ensure modal is closed
                document.getElementById('fullscreen-player').style.display = 'none';
                fullscreenIndex = -1;
            }
        }

        // --- UI & State Sync ---
        function updateAllUI() {
            // Update Fullscreen Play Button
            const fsPlayBtn = document.getElementById('fs-play-btn');
            const isFSPlaying = currentSongIndex === fullscreenIndex && !currentAudio.paused;
            fsPlayBtn.innerHTML = isFSPlaying ? '<i class="fas fa-pause"></i> PAUSE' : '<i class="fas fa-play"></i> PLAY';

            // Sync Fullscreen Vinyl Animation
            const fsVinyl = document.getElementById('fs-vinyl-container');
            if (fsVinyl) {
                if (isFSPlaying) {
                    fsVinyl.classList.add('playing');
                } else {
                    fsVinyl.classList.remove('playing');
                }
            }

            songs.forEach((song, index) => {
                const btn = document.getElementById(`btn-${index}`);
                const card = document.getElementById(`card-${index}`);
                if (!btn || !card) return;

                const isThisSongPlaying = currentSongIndex === index && !currentAudio.paused;
                if (isThisSongPlaying) {
                    btn.innerHTML = '<i class="fas fa-pause"></i> Pause';
                    card.classList.add('playing');
                } else {
                    btn.innerHTML = '<i class="fas fa-play ml-1"></i> Play';
                    card.classList.remove('playing');
                }
            });
            renderPlaylist();
            updatePlaylistControlsUI();
        }

        function renderPlaylist() {
            const container = document.getElementById('playlist-container');
            if (playlist.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center italic">Playlist is empty. Add songs with the \'+\' button.</p>';
                return;
            }
            container.innerHTML = playlist.map((songIndex, pIndex) => {
                const song = songs[songIndex];
                const isThisSongPlaying = isPlaylistActive && currentPlaylistIndex === pIndex && currentAudio && !currentAudio.paused;
                return `
                    <div id="playlist-item-${pIndex}" class="p-2 rounded-lg flex items-center justify-between transition-all cursor-pointer ${isPlaylistActive && currentPlaylistIndex === pIndex ? 'bg-purple-900/50' : 'bg-gray-800/50 hover:bg-gray-700/50'}" onclick="playSong(${songIndex}, true, ${pIndex})">
                        <div class="flex items-center gap-3 pointer-events-none">
                            <span class="text-white">
                                ${isThisSongPlaying ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-play"></i>'}
                            </span>
                            <span class="font-bold text-sm text-gray-200">${song.title}</span>
                        </div>
                        <button class="text-red-500 hover:text-red-300 text-xs z-10" onclick="event.stopPropagation(); removeFromPlaylist(${pIndex})">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `;
            }).join('');
        }

        function updatePlaylistControlsUI() {
            document.getElementById('playlist-shuffle-btn').classList.toggle('playing', playlistOptions.isShuffle);
            document.getElementById('playlist-loop-song-btn').classList.toggle('playing', playlistOptions.isLoopSong);
            document.getElementById('playlist-loop-playlist-btn').classList.toggle('playing', playlistOptions.isLoopPlaylist);

            const playBtn = document.getElementById('playlist-play-btn');
            if (isPlaylistActive && !currentAudio.paused) {
                playBtn.innerHTML = '<i class="fas fa-pause"></i> Pause';
            } else {
                playBtn.innerHTML = '<i class="fas fa-play ml-1"></i> Play';
            }
        }

        let isLoopRunning = false;
        function visualizerLoop() {
            requestAnimationFrame(visualizerLoop);

            let hasAudioData = false;
            if (analyser && isAudioContextInitialized && currentAudio && !currentAudio.paused) {
                try {
                    analyser.getByteFrequencyData(frequencyData);
                    analyser.getByteTimeDomainData(timeDomainData);
                    let sum = 0;
                    for (let i = 0; i < frequencyData.length; i++) {
                        sum += frequencyData[i];
                    }
                    if (sum > 10) {
                        hasAudioData = true;
                    }
                } catch (e) {
                    hasAudioData = false;
                }
            }

            drawBarVisualizer(hasAudioData);
            drawParticleVisualizer(hasAudioData);
        }

        let idlePhase = 0;
        function drawBarVisualizer(hasAudioData) {
            if (!leftVisCtx || !leftVisCanvas) return;
            const canvas = leftVisCanvas;
            const ctx = leftVisCtx;
            if (canvas.width === 0 || canvas.height === 0) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const barWidth = 4;
            const numBars = Math.floor(canvas.width / barWidth);
            if (numBars <= 0) return;

            idlePhase += 0.04;
            let x = 0;
            const bufferLength = analyser ? analyser.frequencyBinCount : 128;

            for (let i = 0; i < numBars; i++) {
                let barHeight = 0;
                if (hasAudioData && frequencyData) {
                    const dataIndex = Math.floor(i * (bufferLength / numBars));
                    barHeight = (frequencyData[dataIndex] / 255) * canvas.height * 0.85;
                    barHeight = Math.max(barHeight, 2);
                } else {
                    const wave1 = Math.sin(idlePhase + i * 0.18);
                    const wave2 = Math.cos(idlePhase * 0.7 + i * 0.09);
                    const normWave = (wave1 + wave2 + 2) / 4;
                    barHeight = 4 + normWave * (canvas.height * 0.22);
                }

                const hue = 250 + (i / numBars) * 60; // Purple to Pink
                ctx.fillStyle = `hsla(${hue}, 100%, 70%, 0.75)`;
                ctx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
                x += barWidth;
            }
        }

        let particles = [];
        let idleParticleTimer = 0;
        function drawParticleVisualizer(hasAudioData) {
            if (!rightVisCtx || !rightVisCanvas) return;
            const canvas = rightVisCanvas;
            const ctx = rightVisCtx;
            if (canvas.width === 0 || canvas.height === 0) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (hasAudioData && timeDomainData) {
                const bufferLength = analyser.frequencyBinCount;
                let sum = 0;
                for (let i = 0; i < bufferLength; i++) {
                    const v = timeDomainData[i] - 128;
                    sum += v * v;
                }
                const avg = Math.sqrt(sum / bufferLength);

                if (avg > 6 && particles.length < 120) {
                    const count = Math.min(Math.floor(avg / 5), 6);
                    for (let i = 0; i < count; i++) {
                        particles.push({
                            x: canvas.width,
                            y: Math.random() * canvas.height,
                            vx: -(Math.random() * 2.5 + avg * 0.12),
                            vy: (Math.random() - 0.5) * 2.5,
                            life: 1.0,
                            size: Math.random() * 2.5 + 1.5,
                            hue: 250 + Math.random() * 60
                        });
                    }
                }
            } else {
                idleParticleTimer++;
                if (idleParticleTimer % 12 === 0 && particles.length < 35) {
                    particles.push({
                        x: canvas.width,
                        y: Math.random() * canvas.height,
                        vx: -(Math.random() * 1.2 + 0.5),
                        vy: (Math.random() - 0.5) * 0.8,
                        life: 1.0,
                        size: Math.random() * 2 + 1,
                        hue: 250 + Math.random() * 60
                    });
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.012;
                if (p.life <= 0 || p.x < -10) {
                    particles.splice(i, 1);
                } else {
                    ctx.beginPath();
                    ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${p.life * 0.8})`;
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function flashNotification(message) {
            const container = document.getElementById('notification-area');
            if (!container) return;
            const notif = document.createElement('div');
            notif.className = 'bg-yellow-accent text-black font-bold p-3 rounded-lg shadow-lg mb-2 animate-fade-in-out';
            notif.innerText = message;
            container.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }

        // --- Persistence ---
        function savePlaylistState() {
            const stateToSave = { playlist, options: playlistOptions };
            localStorage.setItem('beepsmol_music_playlist', JSON.stringify(stateToSave));
        }

        function loadPlaylistState() {
            const saved = localStorage.getItem('beepsmol_music_playlist');
            if (saved) {
                const data = JSON.parse(saved);
                playlist = data.playlist || [];
                playlistOptions = data.options || { isShuffle: false, isLoopSong: false, isLoopPlaylist: false };
            }
            renderPlaylist();
            updatePlaylistControlsUI();
        }

        // --- Init ---
        window.onload = () => {
            renderSongs();
            loadPlaylistState(); // Load saved playlist
            window.onpopstate = checkUrlForSong; // Handle back/forward navigation
            // Use a small timeout to ensure the DOM is fully ready before checking the URL.
            // This can help prevent race conditions on some browsers.
            setTimeout(() => checkUrlForSong(), 100);

            // --- Visualizer Init ---
            leftVisCanvas = document.getElementById('left-visualizer');
            rightVisCanvas = document.getElementById('right-visualizer');
            if (leftVisCanvas && rightVisCanvas) {
                leftVisCtx = leftVisCanvas.getContext('2d');
                rightVisCtx = rightVisCanvas.getContext('2d');
            }
            
            // Layout and Resize Visualizers
            function layoutVisualizers() {
                const nav = document.querySelector('.nav-wrapper');
                if (!nav) return;
                const navHeight = nav.offsetHeight;
                const rightContainer = document.getElementById('right-vis-container');
                const leftContainer = document.getElementById('left-vis-container');

                [leftContainer, rightContainer].forEach(container => {
                    if (container) {
                        const style = window.getComputedStyle(container);
                        if (style.display !== 'none') {
                            container.style.top = `${navHeight}px`;
                            container.style.height = `calc(100vh - ${navHeight}px)`;
                        }
                    }
                });

                if (leftVisCanvas && leftVisCanvas.parentElement) {
                    leftVisCanvas.width = leftVisCanvas.parentElement.clientWidth;
                    leftVisCanvas.height = leftVisCanvas.parentElement.clientHeight;
                }
                if (rightVisCanvas && rightVisCanvas.parentElement) {
                    rightVisCanvas.width = rightVisCanvas.parentElement.clientWidth;
                    rightVisCanvas.height = rightVisCanvas.parentElement.clientHeight;
                }
            }
            window.addEventListener('resize', layoutVisualizers);
            layoutVisualizers(); // Initial layout
            setTimeout(layoutVisualizers, 100);

            // Observe navbar resizing to keep visualizers positioned below navbar
            const navEl = document.querySelector('.nav-wrapper');
            if (navEl && window.ResizeObserver) {
                new ResizeObserver(() => layoutVisualizers()).observe(navEl);
            }

            if (!isLoopRunning) {
                isLoopRunning = true;
                visualizerLoop();
            }

            // AudioContext resume on user gesture
            const resumeAudio = () => {
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            };
            document.addEventListener('click', resumeAudio, { once: false });
            document.addEventListener('keydown', resumeAudio, { once: false });

            // Add animation style for notifications
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes fade-in-out {
                    0% { opacity: 0; transform: translateX(100%); }
                    15% { opacity: 1; transform: translateX(0); }
                    85% { opacity: 1; transform: translateX(0); }
                    100% { opacity: 0; transform: translateX(100%); }
                }
                .animate-fade-in-out { animation: fade-in-out 3s ease-in-out forwards; }
            `;
            document.head.appendChild(style);
        };
    </script>
    <script data-goatcounter="https://beepsmol.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
